# DEPRECATED LAYOUT: this sample is for a source checkout that imports the reference configuration
# at a pinned commit from before examples/config was split into section files. A release uses one
# conveyor.yaml entrypoint with `!include builtin:<file>` instead: see docs/configuration.md and
# `conveyor init`. `conveyor config migrate` converts a configuration built from this sample.
#
# Machine-local settings. Copy next to the operator's other local files (for example
# ~/.config/conveyor-v2/00-core.yaml) and adjust. Settings cannot be imported: paths and
# limits are per machine, and a setting may be declared in one file only.
#
# `import` pins the versioned reference configuration (providers, harnesses, agents, pipelines
# and instructions in examples/config) at a git ref; see docs/migration.md.
import:
  repository: /srv/conveyor/reference-config
  ref: <commit-sha-or-tag>
  path: examples/config

settings:
  runners: 4
  database: /var/lib/conveyor/conveyor.sqlite
  logs: /var/log/conveyor
  workspaces: /var/lib/conveyor/worktrees
  artifacts: /var/lib/conveyor/artifacts
  reconcileInterval: 5m
  maxReturns: 5
  history:
    contextSummaryBytes: 65536
  retries:
    infrastructureAttempts: 5
    usageLimitAttempts: unlimited
    minBackoff: 30s
    maxBackoff: 30m
  taskDefaults:
    wait: { timeout: 30m, poll: 1m }

web:
  listen: 127.0.0.1:4300
  steering:
    agent: omid
    workspace: /srv/conveyor/reference-config
