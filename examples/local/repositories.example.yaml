# Machine-local repositories (folders, egress and deploy/verify script paths). Copy to the
# operator's local configuration and adjust folders and script paths. It lives outside
# examples/config so importing the reference configuration never brings these in.
#
# Stage scripts are machine-local. Each `deploy` script marked `recovery: reconcile` needs an
# `observe` phase before the canary (docs/migration.md).
repositories:
  service:
    items: github
    code: github
    ci: { provider: actions, mode: required }
    address: example/service
    folder: /srv/conveyor/repos/service
    baseBranch: main
    pipeline: delivery
    concurrency: 1
    systemLabels: [backend, testing]
    refinement:
      fields: [Effort, Priority]
      require: { type: true, fields: [Effort], section: true }
    agentEgress:
      allowLoopbackMcp: true
      httpsHosts: [registry.npmjs.org]
    overrides:
      stages:
        deploy:
          actions:
            deployScript: { with: { script: /etc/conveyor/stages/deploy-service.ts, recovery: reconcile } }
        verify:
          actions:
            verifyScript: { with: { script: /etc/conveyor/stages/verify-service.ts, recovery: replay-safe } }
