# Agents and their exact task grants. Instruction paths are relative to this file.
agents:
  darya:
    name: Darya
    title: Product Owner
    harness: codex
    model: gpt-6-sol
    effort: high
    instructions: ./instructions/darya.md
    access: read-only
    tasks: [item.get, item.guidance, item.listOpen, workspace.get, change.get, conversation.get,
            agent.reportProgress, agent.reportRationale, agent.reportBlocker, agent.reportResult,
            agent.reportMilestone, agent.askQuestion, item.comment, item.setCriteria,
            item.setSystemLabels, item.setParent, item.setDependencies, item.createChild]
  kaveh:
    name: Kaveh
    title: Senior Developer
    harness: codex
    model: gpt-6-luna
    effort: high
    instructions: ./instructions/kaveh.md
    access: workspace-write
    tasks: [item.get, item.guidance, workspace.get, change.get, ci.getLogs, conversation.get,
            agent.reportProgress, agent.reportRationale, agent.reportBlocker, agent.reportResult,
            agent.reportMilestone, agent.recordArtifact, agent.askQuestion, item.comment,
            workspace.fetch, workspace.push, change.setMetadata,
            change.listFindings, change.comment, change.resolveFinding]
  shirin:
    name: Shirin
    title: Senior Reviewer
    harness: codex
    model: gpt-5.6-terra
    effort: high
    instructions: ./instructions/shirin.md
    access: read-only
    tasks: [item.get, item.guidance, workspace.get, change.get, ci.getLogs, conversation.get,
            agent.reportProgress, agent.reportRationale, agent.reportBlocker, agent.reportResult,
            agent.reportMilestone, agent.recordArtifact,
            change.listFindings, change.comment, change.resolveFinding,
            change.checkCriterion, change.uncheckCriterion]
  omid:                                    # steering operator (web UI)
    name: Omid
    title: Conveyor Operator
    harness: codex
    model: gpt-6-luna
    effort: medium
    instructions: ./instructions/omid.md
    access: workspace-write
    tasks: [agent.reportProgress, agent.reportRationale, agent.reportBlocker,
            agent.reportResult, agent.reportMilestone]
