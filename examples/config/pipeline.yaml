# The two reference pipelines. Every stage is `actions` followed by a non-empty `exit-gate`;
# there is no AI verifier. YAML anchors copy complete stages; the compiled plan has no
# inheritance. Repositories replace only the deploy and verify script paths, by task id.
pipelines:
  delivery:
    stages:
      - &refinement
        id: refinement
        concurrency: 3
        retries: 2
        childrenStartAt: next
        actions:
          - { id: refine, task: agent.run, with: { agent: darya } }
        exit-gate:
          - { id: criteria, task: item.criteriaDefined }
          - { id: labels, task: item.labelsValid }
          - { id: children, task: item.childrenValid }
          - id: dependencies
            task: item.dependenciesMet
            wait: { timeout: unlimited, poll: 5m }

      - id: implementation
        concurrency: 2
        retries: 3
        actions:
          - { id: workspace, task: workspace.ensure }
          - { id: implement, task: agent.run, with: { agent: kaveh } }
          - id: ensureChange
            task: change.ensure
            with: { closingReference: true, criteriaChecklist: true }
          - { id: startCi, task: ci.start, when: ci.enabled }
        exit-gate:
          - { id: pushed, task: workspace.pushed }
          - { id: criteriaSynced, task: change.criteriaInSync }
          - id: ciDefined
            task: ci.defined
            when: ci.required
            onFail: { stop: blocked }
          - id: ciGate
            task: ci.passed
            when: ci.required
            wait: { timeout: 3h, poll: 1m }

      - &review
        id: review
        concurrency: 1
        actions:
          - { id: review, task: agent.run, with: { agents: [shaghayegh, shirin] } }
        exit-gate:
          - { id: findings, task: change.findingsResolved, onFail: { return: implementation } }
          - { id: criteriaApproved, task: change.criteriaChecked, onFail: { return: implementation } }
          - { id: ciHead, task: change.headUnchanged, when: ci.required, onFail: { return: implementation } }
          - id: mergeable
            task: change.mergeable
            wait: { timeout: 30m, poll: 1m }
            onFail: { return: implementation }

      - &merge
        id: merge
        concurrency: 1
        actions:
          - { id: mergeReviewedHead, task: change.merge, with: { method: squash } }
        exit-gate:
          - { id: merged, task: change.merged, onFail: { return: implementation } }

      # Repositories replace the two script paths through stable-ID overrides.
      - &deploy
        id: deploy
        concurrency: 1
        actions:
          - { id: deployScript, task: script.run, with: { script: ./stages/deploy.ts, recovery: reconcile } }
        exit-gate:
          - { id: deployed, task: script.succeeded, with: { run: deployScript }, onFail: { stop: needs-intervention } }

      - &verify
        id: verify
        concurrency: 1
        actions:
          - { id: verifyScript, task: script.run, with: { script: ./stages/verify.ts, recovery: replay-safe } }
        exit-gate:
          - { id: verified, task: script.succeeded, with: { run: verifyScript }, onFail: { stop: needs-intervention } }

      - &cleanup
        id: cleanup
        concurrency: 4
        actions:
          - { id: removeWorkspace, task: workspace.cleanup }
        exit-gate:
          - { id: removed, task: workspace.removed, onFail: { stop: needs-intervention } }

  # Midgame: a full implementation stage with one extra action and gate.
  midgame-delivery:
    stages:
      - *refinement
      - id: implementation
        concurrency: 2
        retries: 3
        actions:
          - { id: workspace, task: workspace.ensure }
          - { id: implement, task: agent.run, with: { agent: kaveh } }
          - { id: localChecks, task: script.run, with: { script: ./checks/implementation-exit-midgame.ts, recovery: replay-safe } }
          - { id: ensureChange, task: change.ensure, with: { closingReference: true, criteriaChecklist: true } }
          - { id: startCi, task: ci.start, when: ci.enabled }
        exit-gate:
          - { id: pushed, task: workspace.pushed }
          - { id: criteriaSynced, task: change.criteriaInSync }
          - { id: localChecksPassed, task: script.succeeded, with: { run: localChecks } }
          - { id: ciDefined, task: ci.defined, when: ci.required, onFail: { stop: blocked } }
          - { id: ciGate, task: ci.passed, when: ci.required, wait: { timeout: 8h, poll: 5m } }
      - *review
      - *merge
      - *deploy
      - *verify
      - *cleanup
