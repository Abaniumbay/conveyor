name: Check

# The CI gate Conveyor waits for on its own pull requests: every test and the
# TypeScript typecheck. Runs on every push to a pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Configure git for workspace tests
        run: |
          git config --global user.name "Conveyor CI"
          git config --global user.email "ci@conveyor.invalid"
          git config --global init.defaultBranch main
      - run: bun install --frozen-lockfile
      - name: Install and verify Bubblewrap sandbox coverage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-net --dev-bind / / true
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check release-note fragments
        run: bun run changelog > /dev/null
      - name: Run tests with coverage and JUnit report
        run: |
          mkdir -p test-results
          bun test --coverage --coverage-reporter=lcov --reporter=junit > test-results/junit.xml
      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Store main LCOV
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30
      - name: Download latest main LCOV
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: check.yml
          branch: main
          name: main-lcov
          path: coverage/main
          if_no_artifact_found: ignore
          workflow_conclusion: ''
      - name: Check changed production-line coverage
        shell: bash
        run: |
          baseline=()
          if [[ -e coverage/main/lcov.info ]]; then
            baseline=(--baseline-lcov coverage/main/lcov.info)
          fi
          bun run scripts/check-changed-coverage.ts --base origin/main --lcov coverage/lcov.info "${baseline[@]}"
      - run: bun run benchmark:dashboard
      - run: bun run typecheck
      - name: Verify release tests after release preparation
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/release-check.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          git archive --format=tar HEAD | tar -x -C "$scratch"
          if ! find "$scratch/changes" -maxdepth 1 -type f -name '*.md' -print -quit 2>/dev/null | grep -q .; then
            mkdir -p "$scratch/changes"
            printf '%s\n' '---' 'section: Fixed' '---' 'Scratch release-test fragment.' > "$scratch/changes/999-release-test.md"
          fi
          cd "$scratch"
          bun install --frozen-lockfile
          version="$(bun -e 'const manifest = await Bun.file("package.json").json(); console.log(`${Number(manifest.version.split(".")[0]) + 1}.0.0`);')"
          bun run scripts/release.ts prepare "$version"
          bun test tests/release
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
  package:
    name: Package and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Builds the release archive, then installs it with install.sh and exercises it outside the
      # checkout, without Bun on PATH: init, config, dashboard assets, sign-in, bridge, agent + MCP,
      # status and logs; then upgrades to a second build and rolls back, restarting like systemd.
      - run: bun run build
      - name: Verify retired installation defaults are not packaged
        run: |
          forbidden='AmirRaptoR|midgame-actions|midgame-delivery|allowedHumanLogins'
          archive="$(find dist -name '*-linux-x64.tar.gz' -print -quit)"
          test -n "$archive"
          temporary="$(mktemp -d)"
          tar -xzf "$archive" -C "$temporary"
          executable="$(find "$temporary" -type f -name conveyor -print -quit)"
          test -n "$executable"
          for builtin in $("$executable" config builtin); do
            if "$executable" config builtin "$builtin" | grep -aE "$forbidden"; then
              echo "retired installation default found in $builtin"
              exit 1
            fi
          done
          if grep -aE "$forbidden" "$executable"; then
            echo "retired installation default found in executable"
            exit 1
          fi
      - run: bun run scripts/build.ts --out dist-next --version 99.0.0-next
      - run: bun run scripts/smoke-test.ts --dist dist --next dist-next

  screenshots:
    name: Check dashboard screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare an untouched outside home
        run: |
          mkdir -p "$RUNNER_TEMP/conveyor-existing-home"
          printf 'must remain unchanged' > "$RUNNER_TEMP/conveyor-existing-home/sentinel"
      - name: Generate populated isolated screenshots
        env:
          CONVEYOR_HOME: ${{ runner.temp }}/conveyor-existing-home
          GH_TOKEN: deliberately-unusable
        run: bun run docs:screenshots
      - name: Verify isolation, documented references, and generated PNGs
        run: |
          test "$(cat "$RUNNER_TEMP/conveyor-existing-home/sentinel")" = 'must remain unchanged'
          test ! -e "$RUNNER_TEMP/conveyor-existing-home/state/conveyor.sqlite"
          for image in board board-scrolled board-phone board-phone-scrolled item reports operator team repositories repository; do
            test -s "docs/screenshots/$image.png"
            grep -Fq "docs/screenshots/$image.png" README.md
            grep -Fq "screenshots/$image.png" docs/dashboard.md
          done
      - name: Capture checksums
        run: sha256sum docs/screenshots/{board,board-scrolled,board-phone,board-phone-scrolled,item,reports,operator,team,repositories,repository}.png > "$RUNNER_TEMP/screenshot-checksums"
      - name: Regenerate for repeatability
        run: bun run docs:screenshots
      - name: Verify pixel-identical repeatability
        run: sha256sum -c "$RUNNER_TEMP/screenshot-checksums"
