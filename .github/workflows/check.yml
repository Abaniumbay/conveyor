name: Check

# The CI gate Conveyor waits for on its own pull requests: every test and the
# TypeScript typecheck. Runs on every push to a pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Configure git for workspace tests
        run: |
          git config --global user.name "Conveyor CI"
          git config --global user.email "ci@conveyor.invalid"
          git config --global init.defaultBranch main
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    name: Package and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Builds the release archive, then installs it with install.sh and exercises it outside the
      # checkout, without Bun on PATH: init, config, dashboard assets, sign-in, bridge, agent + MCP,
      # status and logs; then upgrades to a second build and rolls back, restarting like systemd.
      - run: bun run build
      - run: bun run scripts/build.ts --out dist-next --version 99.0.0-next
      - run: bun run scripts/smoke-test.ts --dist dist --next dist-next

  screenshots:
    name: Check dashboard screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare an untouched outside home
        run: |
          mkdir -p "$RUNNER_TEMP/conveyor-existing-home"
          printf 'must remain unchanged' > "$RUNNER_TEMP/conveyor-existing-home/sentinel"
      - name: Generate populated isolated screenshots
        env:
          CONVEYOR_HOME: ${{ runner.temp }}/conveyor-existing-home
          GH_TOKEN: deliberately-unusable
        run: bun run docs:screenshots
      - name: Verify isolation, documented references, and generated PNGs
        run: |
          test "$(cat "$RUNNER_TEMP/conveyor-existing-home/sentinel")" = 'must remain unchanged'
          test ! -e "$RUNNER_TEMP/conveyor-existing-home/state/conveyor.sqlite"
          for image in board item reports operator team; do
            test -s "docs/screenshots/$image.png"
            grep -Fq "docs/screenshots/$image.png" README.md
            grep -Fq "screenshots/$image.png" docs/dashboard.md
          done
      - name: Capture checksums
        run: sha256sum docs/screenshots/{board,item,reports,operator,team}.png > "$RUNNER_TEMP/screenshot-checksums"
      - name: Regenerate for repeatability
        run: bun run docs:screenshots
      - name: Verify pixel-identical repeatability
        run: sha256sum -c "$RUNNER_TEMP/screenshot-checksums"
