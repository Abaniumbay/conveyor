name: Tag release

# Merging a "Release vX.Y.Z" pull request (branch release/vX.Y.Z) tags the release commit and starts
# the Release workflow on that tag. A tag pushed with the workflow token does not start workflows by
# itself, so it is started explicitly.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag and publish the release
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Tag the release commit and start the Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${BRANCH#release/v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$BRANCH does not name a version"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run release tag "$version" --yes
          gh workflow run release.yml --ref "v$version"
          echo "Started the Release workflow for v$version: gh run list --workflow release.yml"
