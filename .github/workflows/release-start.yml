name: Start release

# Run from the Actions tab: opens the "Release vX.Y.Z" pull request with its notes and the version
# they call for, worked out from the changelog fragments (docs/releasing.md). Merging that pull request tags and publishes the release
# (release-tag.yml). Without a summary, the notes open with the commits merged since the last release.
on:
  workflow_dispatch:
    inputs:
      summary:
        description: Release summary (optional; empty lists the commits since the last release)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-start
  cancel-in-progress: false

jobs:
  start:
    name: Open the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SUMMARY" ]; then
            bun run release start --summary "$SUMMARY" --yes
          else
            bun run release start --summary-from-commits --yes
          fi
