pipelines:
  service-delivery:
    successStatuses: [done, skipped]
    failureStatuses: [blocked, rejected, error, changes-requested, needs-input, needs-intervention]
    stages:
      - id: refinement
        run: { agent: darya }
        concurrency: 3
        childrenStartAt: next
        enterCheck: generic
        exitCheck: refinement-exit
        feedbackCycles: 2
      - id: implementation
        run: { agent: kaveh }
        concurrency: 2
        enterCheck: generic
        exitCheck: implementation-exit
        feedbackCycles: 2
        afterSuccess:
          - sourceAction: pullRequest.ensure
            with: { closingReference: true }
      - id: ci
        run:
          sourceAction: pullRequest.awaitChecks
          with: { settleSeconds: 120, pollSeconds: 60, timeoutMinutes: 180, maxCorrections: 5 }
        concurrency: 8
        feedbackCycles: 0
        failurePolicies:
          changes-requested: { action: returnToPrevious }
      - id: review
        run: { agent: shirin }
        concurrency: 1
        enterCheck: generic
        exitCheck: generic
        feedbackCycles: 2
        failurePolicies:
          changes-requested: { action: returnToPrevious, stage: implementation }
      - id: merge
        run: { sourceAction: pullRequest.squashMerge }
        concurrency: 1
        enterCheck: generic
        exitCheck: generic
      - id: deploy
        run: { runner: process, script: /srv/conveyor/stages/deploy-service.ts }
        concurrency: 1
        feedbackCycles: 0
        failureState: needs-intervention
      - id: verify
        run: { runner: process, script: /srv/conveyor/stages/verify-service.ts }
        concurrency: 1
        feedbackCycles: 0
        failureState: needs-intervention
      - id: cleanup
        run: { sourceAction: workspace.cleanup }
        concurrency: 4
        feedbackCycles: 0
        failureState: needs-intervention
